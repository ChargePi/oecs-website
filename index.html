<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('oecs-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <meta
      name="description"
      content="OECS is an open, vendor-neutral, computer-readable schema for EV charger specifications — so you can compare hardware for your use case without reading a PDF."
    />
    <meta property="og:title" content="OECS — Open EV Charger Schema" />
    <meta
      property="og:description"
      content="One standard schema for every charger spec. Compare vendor hardware programmatically instead of reading PDFs."
    />
    <meta property="og:type" content="website" />
    <title>OECS — Open EV Charger Schema</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
